# Suggested key bindings for the bridge commands. Nothing here is applied
# automatically: copy the lines you want into ~/.config/helix/config.toml.
# Every bridge command is an ordinary typed command, so any key works.
#
# They sit under `space t` ("thread"), which Helix leaves free, so none of
# Helix's own bindings is replaced. Helix refuses a config that names a
# command it does not have, so only copy a line once `:bb-status` lists the
# capability it needs.

[keys.normal.space.t]
s = ":bb-send"            # selection (or current line) to the thread's composer
c = ":bb-comment"         # comment on the selection; opens a prompt
C = ":bb-comments-send"   # send all pending comments to the agent
i = ":bb-status"          # socket, clients and capabilities

[keys.select.space.t]
s = ":bb-send"
c = ":bb-comment"

# Needs capability "locations":
# [keys.normal.space.t]
# n = ":bb-next"          # next place in the active list (agent changes, tour)
# p = ":bb-prev"
# l = ":bb-locations"     # browse the active list
#
# Needs capability "command" (the waiting behaviour):
# g = ":bb-go"            # accept a jump the agent asked for while you typed
#
# Needs capability "annotations":
# a = ":bb-annotations"   # show or hide comments drawn in the code
