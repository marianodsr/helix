# Suggested key bindings for the bridge commands. Nothing here is applied
# automatically: copy the lines you want into ~/.config/helix/config.toml.
#
# They are written as macros ("@:command<ret>") on purpose. Helix refuses a
# whole config that names a typed command it does not have, so a plain
# ":bb-send" would make a stock `hx` reject the file. A macro is only looked
# up when the key is pressed: stock `hx` keeps loading the config and the key
# reports an unknown command there.
#
# They sit under `space u`, which Helix leaves free; the bb plugin's hints
# name these keys. `space e` replaces Helix's own file explorer with the
# yazi tree.

[keys.normal.space]
e = "@:bb-files<ret>"                       # the file tree (yazi)

[keys.normal.space.u]
c = "@:bb-comment<ret>"                     # comment on the selection (bb's comment box, or a prompt outside bb)
s = "@:bb-send<ret>"                        # selection (or current line) to the thread's composer
C = "@:bb-emit review.send<ret>"            # send the comments that are waiting
f = "@:bb-emit review.next-file<ret>"       # next changed file (starts a review if none is active)
F = "@:bb-emit review.prev-file<ret>"       # previous changed file
v = "@:bb-emit review.viewed<ret>"          # mark this file viewed and go to the next
d = "@:bb-diff<ret>"                        # inline diff on or off
u = "@:bb-emit rail.toggle<ret>"            # the rail, on the tab it was on
r = "@:bb-emit rail.changes<ret>"           # the rail on Changes
m = "@:bb-emit rail.comments<ret>"          # the rail on Comments
t = "@:bb-emit chat.focus<ret>"             # the thread's chat (Escape there comes back)
n = "@:bb-next<ret>"                        # next place in the active list (agent changes, tour, review)
p = "@:bb-prev<ret>"
l = "@:bb-locations<ret>"                   # browse the active list
g = "@:bb-go<ret>"                          # accept a jump the agent asked for while you typed
a = "@:bb-annotations<ret>"                 # show or hide comments drawn in the code
i = "@:bb-status<ret>"                      # socket, clients and what this build offers

[keys.select.space]
e = "@:bb-files<ret>"

[keys.select.space.u]
c = "@:bb-comment<ret>"
s = "@:bb-send<ret>"
