theme = "catppuccin_macchiato"

[editor]
true-color = true
line-number = "relative"
bufferline = "multiple"
end-of-line-diagnostics = "hint"
soft-wrap.enable = true

[editor.lsp]
display-inlay-hints = false

[editor.inline-diagnostics]
cursor-line = "error"

[editor.indent-guides]
render = true
skip-levels = 1


[keys.normal]
F = "file_picker_in_current_buffer_directory"

# space e opens the yazi file tree in hxb. Written as a macro so stock hx
# still accepts this file (there, the key reports an unknown command).
[keys.normal.space]
e = "@:bb-files<ret>"

[keys.select.space]
e = "@:bb-files<ret>"

# Bridge commands under space t (thread). Macros, so stock hx still accepts this file.
[keys.normal.space.t]
c = "@:bb-comment<ret>"                     # comment on the selection (bb's comment box, or a prompt outside bb)
s = "@:bb-send<ret>"                        # selection (or current line) to the thread's composer
C = "@:bb-emit review.send<ret>"            # send the comments that are waiting
f = "@:bb-emit review.next-file<ret>"       # next changed file (starts a review if none is active)
F = "@:bb-emit review.prev-file<ret>"       # previous changed file
v = "@:bb-emit review.viewed<ret>"          # mark this file viewed and go to the next
d = "@:bb-diff<ret>"                        # inline diff on or off
r = "@:bb-emit rail.changes<ret>"           # the Changes tab
m = "@:bb-emit rail.comments<ret>"          # the Comments tab
t = "@:bb-emit chat.focus<ret>"             # the thread's chat
n = "@:bb-next<ret>"                        # next place in the active list (agent changes, tour, review)
p = "@:bb-prev<ret>"
l = "@:bb-locations<ret>"                   # browse the active list
g = "@:bb-go<ret>"                          # accept a jump the agent asked for while you typed
a = "@:bb-annotations<ret>"                 # show or hide comments drawn in the code
i = "@:bb-status<ret>"                      # socket, clients and what this build offers

[keys.select.space.t]
c = "@:bb-comment<ret>"
s = "@:bb-send<ret>"

