theme = "catppuccin_macchiato"

[editor]
true-color = true
line-number = "relative"
bufferline = "multiple"
end-of-line-diagnostics = "hint"
soft-wrap.enable = true

[editor.lsp]
display-inlay-hints = false

[editor.inline-diagnostics]
cursor-line = "error"

[editor.indent-guides]
render = true
skip-levels = 1


[keys.normal]
F = "file_picker_in_current_buffer_directory"

# space e opens the yazi file tree in hxb. Written as a macro so stock hx
# still accepts this file (there, the key reports an unknown command).
[keys.normal.space]
e = "@:bb-files<ret>"

[keys.select.space]
e = "@:bb-files<ret>"

