[[language]]
name = "go"
auto-format = true
formatter = { command = "goimports" }

[language-server.gopls]
config = { "build.buildFlags" = ["-tags=pipelineOne,pipelineTwo,step"] }


## ELIXIR
# 
[[language]]
name = "elixir"
auto-format = true
formatter = { command = "mix", args = ["format", "-"] }
language-servers = ["elixir-ls"]

[language-server.elixir-ls]
command = "elixir-ls"

### NODEJS

 [[language]]
 name = "javascript"
 language-servers = [ "typescript-language-server", "eslint"]
 formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
 auto-format = true

 [[language]]
 name = "typescript"
 language-servers = [ "typescript-language-server", "eslint", "emmet-ls" ]
 formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
 file-types = ["ts"]
 auto-format = true

 [[language]]
 name = "jsx"
 language-servers = [ "typescript-language-server", "eslint", "emmet-ls" ]
 formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
 auto-format = true

 [[language]]
 name = "tsx"
 language-servers = [ "typescript-language-server", "eslint", "emmet-ls" ]
 formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
 auto-format = true

 [language-server.typescript-language-server]
 command = "typescript-language-server"
 args = ["--stdio"]

 [language-server.typescript-language-server.config]
 hostInfo = "helix"

 [language-server.typescript-language-server.config.typescript.inlayHints]
 includeInlayParameterNameHints = "all"
 includeInlayFunctionParameterTypeHints = true

 [language-server.typescript-language-server.config.javascript.inlayHints]
 includeInlayParameterNameHints = "all"

 [language-server.eslint]
 command = "vscode-eslint-language-server"
 args = ["--stdio"]

 [language-server.eslint.config]
 codeActionsOnSave = { mode = "all", "source.fixAll.eslint" = true }
 format = { enable = true }
 nodePath = ""
 quiet = false
 rulesCustomizations = []
 run = "onType"
 validate = "on"
 experimental = {}
 problems = { shortenToSingleLine = false }

 [language-server.eslint.config.codeAction]
 disableRuleComment = { enable = true, location = "separateLine" }
 showDocumentation = { enable = false }

 [language-server.emmet-ls]
 command = "emmet-ls"
 args = ["--stdio"]

 [language-server.vscode-css-language-server.config]
 css = { validate = { enable = true } }
 scss = { validate = { enable = true } }
 less = { validate = { enable = true } }
 provideFormatter = true

#### DENO

[[language]]
name = "typescript"
roots = ["deno.json", "deno.jsonc"]
auto-format = true
language-servers = ["deno-lsp"]

[[language]]
name = "javascript"
roots = ["deno.json", "deno.jsonc"]
auto-format = true
language-servers = ["deno-lsp"]

[language-server.deno-lsp]
command = "deno"
args = ["lsp"]

[language-server.deno-lsp.config.deno]
enable = true

[[language]]
name = "json"
formatter = { command = "prettier", args = [ "--parser", "json" ] }
auto-format = true

[language-server.vscode-json-language-server.config]
json = { validate = { enable = true }, format = { enable = true } }
provideFormatter = true

[[language]]
name = "html"
language-servers = [ "vscode-html-language-server"]
formatter = { command = 'prettier', args = ["--parser", "html"] }
auto-format = true

[[language]]
name = "css"
language-servers = [ "vscode-css-language-server"]
formatter = { command = 'prettier', args = ["--parser", "css"] }
auto-format = true

# [language-server.rubocop]
# command = "bundle"
# args = ["exec", "rubocop", "--lsp"]

[[language]]
name = "ruby"
auto-format = true
language-servers = [
  { name = "solargraph" }
]
file-types = [
  "rb",
  "rake",
  "irb",
  "gemspec",
  "rabl",
  "jbuilder",
  "jb",
  "podspec",
  "rjs",
  "rbi",
  "rbs",
  { glob = "rakefile" },
  { glob = "gemfile" },
  { glob = "Rakefile" },
  { glob = "Gemfile" },
  { glob = "Podfile" },
  { glob = "Vagrantfile" },
  { glob = "Brewfile" },
  { glob = "Guardfile" },
  { glob = "Capfile" },
  { glob = "Cheffile" },
  { glob = "Hobofile" },
  { glob = "Appraisals" },
  { glob = "Rantfile" },
  { glob = "Berksfile" },
  { glob = "Berksfile.lock" },
  { glob = "Thorfile" },
  { glob = "Puppetfile" },
  { glob = "Fastfile" },
  { glob = "Appfile" },
  { glob = "Deliverfile" },
  { glob = "Matchfile" },
  { glob = "Scanfile" },
  { glob = "Snapfile" },
  { glob = "Gymfile" },
]
indent = { tab-width = 2, unit = "  " }

[language-server.solargraph]
command = "solargraph"
args = ["stdio"]

[[language]]
name = "python"
scope = "source.python"
injection-regex = "python"
file-types = ["py","pyi","py3","pyw",".pythonstartup",".pythonrc"]
shebangs = ["python"]
roots = [".", "pyproject.toml", "pyrightconfig.json"]
comment-token = "#"
language-servers = ["pyright", "flake8"]
indent = { tab-width = 4, unit = "    " }
auto-format = true

[language.formatter]
command = "black"
args = [
  "-",
  "--quiet",
  "--line-length=88"
]

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config]
reportMissingTypeStubs = false

[language-server.pyright.config.python.analysis]
typeCheckingMode = "basic"
autoImportCompletions = true

[language-server.flake8]
command = "flake8"
args = ["--format=%(row)d,%(col)d,%(code)s,%(text)s", "--stdin-display-name", "{}", "-"]
